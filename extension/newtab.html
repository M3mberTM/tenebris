<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/icon-32.png">
    <title>ㅤ</title>
    <link rel="stylesheet" href="newtab.css">
</head>

<body>
    <img id="wallpaper" alt="" class="wallpaper" src="images/background.png">
    <div class="bookmarksHoverable">
        <div class="bookmarksToggle"></div>
        <div class="bookmarksSidebar" id="leftBookmarksSidebar">
            <div class="bookmarksHeader">
                <h2 class="bookmarksTitle">BOOKMARKS</h3>
            </div>
            <div id="leftBookmarksList" class="bookmarksList"> </div>
        </div>
    </div>

    <div class="bookmarksHoverable right">
        <div class="bookmarksToggle"></div>
        <div class="bookmarksSidebar" id="rightBookmarksSidebar">
            <div class="bookmarksHeader">
                <h2 class="bookmarksTitle">ALL BOOKMARKS</h3>
            </div>
            <div id="rightBookmarksList" class="bookmarksList"> </div>
        </div>
    </div>
    <div id="bookmarkContextMenu" class="contextMenu" hidden>
        <button type="button" data-action="rename">Rename</button>
        <button type="button" data-action="remove" class="removeAction">Remove</button>
    </div>
    <div class="renameModal" id="renameModal" hidden>
        <form id="renameForm">
            <input type="text" id="renameInput" name="newTitle">
        </form>
    </div>
    <script type="module" src="dist/index.js"></script>
</body>

</html>
